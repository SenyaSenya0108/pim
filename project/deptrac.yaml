deptrac:
    ignore_uncovered_internal_classes: false
    paths:
        - ./src
    layers:
        -   name: Application
            collectors:
                -   type: directory
                    value: src/Application/.*
        -   name: User
            collectors:
                -   type: directory
                    value: src/Modules/User.*
        -   name: Catalog
            collectors:
                -   type: directory
                    value: src/Modules/Catalog/.*
    ruleset:
        User:
            - Application
        Service:
            - Application
