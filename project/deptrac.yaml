deptrac:
    ignore_uncovered_internal_classes: false
    paths:
        - ./src
    layers:
        -   name: Common
            collectors:
                -   type: directory
                    value: src/Common/.*
        -   name: User
            collectors:
                -   type: directory
                    value: src/User.*
        -   name: Catalog
            collectors:
                -   type: directory
                    value: src/Catalog/.*
    ruleset:
        User:
            - Common
        Service:
            - Common
